<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Paciente | Sistema Médico</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
  <div class="medical-form-container">
    <div class="medical-form-card">
      <div class="form-header">
        <h1><i class="icon-user-plus"></i> Agregar Nuevo Paciente</h1>
        <p>Complete todos los campos requeridos (*) para registrar un nuevo paciente</p>
      </div>

      <form action="{{ url_for('agregar_paciente') }}" method="POST" class="medical-form">
        <div class="form-section">
          <h2 class="form-section-title"><i class="icon-id-card"></i> Información Básica</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="nombre">Nombre Completo *</label>
              <input type="text" id="nombre" name="nombre" placeholder="Ej: María González López" required>
            </div>
            <div class="form-group">
              <label for="email">Correo Electrónico *</label>
              <input type="email" id="email" name="email" placeholder="Ej: paciente@correo.com" required>
            </div>
            <div class="form-group">
              <label for="telefono">Teléfono *</label>
              <input type="tel" id="telefono" name="telefono" placeholder="Ej: 1234567890" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group">
              <label for="fecha_nacimiento">Fecha de Nacimiento</label>
              <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" placeholder="Seleccione fecha">
            </div>
            <div class="form-group">
              <label for="genero">Género</label>
              <select id="genero" name="genero">
                <option value="">Seleccione...</option>
                <option value="masculino">Masculino</option>
               Ghost
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
                <option value="no_especificado">Prefiero no decir</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h2 class="form-section-title"><i class="icon-health"></i> Datos Médicos</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="peso">Peso (kg)</label>
              <div class="input-unit">
                <input type="number" step="0.1" id="peso" name="peso" placeholder="0.0">
                <span class="unit">kg</span>
              </div>
            </div>
            <div class="form-group">
              <label for="altura">Altura (m)</label>
              <div class="input-unit">
                <input type="number" step="0.01" id="altura" name="altura" placeholder="0.00">
                <span class="unit">m</span>
              </div>
            </div>
            <div class="form-group form-full-width">
              <label for="condiciones_medicas">Condiciones Médicas</label>
              <div class="textarea-container">
                <textarea id="condiciones_medicas" name="condiciones_medicas" class="form-textarea" placeholder="Liste todas las condiciones médicas conocidas"></textarea>
                <span class="char-counter" id="condiciones-counter">0/500</span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h2 class="form-section-title"><i class="icon-notes"></i> Observaciones</h2>
          <div class="form-group">
            <label for="notas">Notas Adicionales</label>
            <div class="textarea-container">
              <textarea id="notas" name="notas" class="form-textarea" placeholder="Agregue cualquier información adicional relevante"></textarea>
              <span class="char-counter" id="notas-counter">0/300</span>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
            <i class="icon-arrow-left"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="icon-save"></i> Guardar Paciente
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script>
    flatpickr("#fecha_nacimiento", {
      locale: "es",
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "j F, Y",
      allowInput: true
    });

    const setupCounter = (textareaId, counterId, maxLength) => {
      const textarea = document.getElementById(textareaId);
      const counter = document.getElementById(counterId);
      
      textarea.addEventListener('input', (e) => {
        const remaining = maxLength - e.target.value.length;
        counter.textContent = `${e.target.value.length}/${maxLength}`;
        counter.style.color = remaining < 50 ? '#e63946' : '#6c757d';
      });
    };

    setupCounter('condiciones_medicas', 'condiciones-counter', 500);
    setupCounter('notas', 'notas-counter', 300);
  </script>
</body>
</html>
