<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Estudio Médico | Sistema Médico</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="medical-form-container">
    <div class="medical-form-card">
      <div class="form-header">
        <h1><i class="fas fa-file-upload"></i> Subir Estudio Médico</h1>
        <p>Paciente: {{ patient.nombre }}</p>
      </div>

      <form action="{{ url_for('subir_estudio', patient_id=patient.id) }}" method="POST" enctype="multipart/form-data" class="medical-form">
        <div class="form-section">
          <h2 class="form-section-title"><i class="fas fa-file-medical"></i> Información del Estudio</h2>
          <div class="form-grid">
            <div class="form-group form-full-width">
              <label for="file">Archivo del Estudio *</label>
              <input type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" required>
              <small class="form-text">Formatos permitidos: PDF, PNG, JPG, JPEG, DOC, DOCX (Máx. 16MB)</small>
            </div>
            
            <div class="form-group form-full-width">
              <label for="description">Descripción</label>
              <textarea id="description" name="description" placeholder="Descripción del estudio (opcional)"></textarea>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a href="{{ url_for('ver_estudios', patient_id=patient.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-upload"></i> Subir Estudio
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
