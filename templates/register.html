<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="form-container">
    <div class="form-card">
      <h1 class="form-title">Crear Cuenta</h1>
      
      <form action="/register" method="POST">
        <div class="form-group">
          <label for="nombrecompleto">Nombre Completo</label>
          <input type="text" id="nombrecompleto" name="nombrecompleto" placeholder="Ej: Juan Pérez García" required>
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="Ej: ejemplo@dominio.com" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej: 5512345678" required>
          </div>
          
          <div class="form-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" placeholder="Ej: 35" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" name="sexo" required>
            <option value="">Selecciona tu sexo</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="licencia">Cédula Profesional</label>
          <input type="text" id="licencia" name="licencia" placeholder="Ej: 12345678" required>
        </div>
        
        <div class="form-group">
          <label for="especialidad">Especialidad</label>
          <select id="especialidad" name="especialidad" required>
          <option value="">Selecciona tu especialidad</option>
          <option value="Cardiología">Cardiología</option>
          <option value="Dermatología">Dermatología</option>
          <option value="Endocrinología">Endocrinología</option>
          <option value="Gastroenterología">Gastroenterología</option>
          <option value="Neurología">Neurología</option>
          <option value="Oftalmología">Oftalmología</option>
          <option value="Oncología">Oncología</option>
          <option value="Ortopedia">Ortopedia</option>
          <option value="Pediatría">Pediatría</option>
          <option value="Psiquiatría">Psiquiatría</option>
          <option value="Radiología">Radiología</option>
          <option value="Urología">Urología</option>
          <option value="Cirugía General">Cirugía General</option>
          <option value="Anestesiología">Anestesiología</option>
          <option value="Ginecología">Ginecología</option>
          <option value="Otorrinolaringología">Otorrinolaringología</option>
          <option value="Traumatología">Traumatología</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
      </form>
      
      <div class="form-footer">
        ¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a>
      </div>
    </div>
  </div>
</body>
</html>
