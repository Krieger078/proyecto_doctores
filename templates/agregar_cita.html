<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programar Cita | Sistema Médico</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
  <div class="medical-form-container">
    <div class="medical-form-card">
      <div class="form-header">
        <h1><i class="fas fa-calendar-alt"></i> Programar Cita para {{ patient.nombre }}</h1>
        <p>Ingrese los detalles de la cita médica</p>
      </div>

      <form action="{{ url_for('agregar_cita', patient_id=patient.id) }}" method="POST" class="medical-form">
        <div class="form-section">
          <h2 class="form-section-title"><i class="fas fa-calendar-check"></i> Detalles de la Cita</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="fecha_cita">Fecha y Hora *</label>
              <input type="datetime-local" id="fecha_cita" name="fecha_cita" required>
            </div>
            <div class="form-group form-full-width">
              <label for="motivo">Motivo de la Cita</label>
              <div class="textarea-container">
                <textarea id="motivo" name="motivo" class="form-textarea" placeholder="Describa el motivo de la cita"></textarea>
                <span class="char-counter" id="motivo-counter">0/500</span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a href="{{ url_for('detalle_paciente', patient_id=patient.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Programar Cita
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script>
    flatpickr("#fecha_cita", {
      locale: "es",
      enableTime: true,
      dateFormat: "Y-m-d\\TH:i",
      altInput: true,
      altFormat: "j F, Y H:i",
      minDate: "today",
      time_24hr: true
    });

    const setupCounter = (textareaId, counterId, maxLength) => {
      const textarea = document.getElementById(textareaId);
      const counter = document.getElementById(counterId);
      
      textarea.addEventListener('input', (e) => {
        const remaining = maxLength - e.target.value.length;
        counter.textContent = `${e.target.value.length}/${maxLength}`;
        counter.style.color = remaining < 50 ? '#e63946' : '#6c757d';
      });
    };

    setupCounter('motivo', 'motivo-counter', 500);
  </script>
</body>
</html>
