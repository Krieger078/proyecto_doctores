<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar Pacientes</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="delete-patient-container">
      <h1><i class="fas fa-user-times"></i> Eliminar Pacientes</h1>
      {% if patients %}
      <ul class="delete-patient-list">
          {% for patient in patients %}
          <li class="delete-patient-item">
              <p>{{ patient.nombre }}</p>
              <form class="delete-patient-form" action="{{ url_for('eliminar_paciente', patient_id=patient.id) }}" method="POST">
                  <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash-alt"></i> Eliminar
                  </button>
              </form>
          </li>
          {% endfor %}
      </ul>
      {% else %}
      <p class="no-patients-message">No hay pacientes registrados.</p>
      {% endif %}
      <div class="patient-actions">
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Volver al Panel
        </a>
      </div>
  </div>
</body>
</html>
