<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control | Sistema Médico</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1><i class="fas fa-clipboard-list"></i> Panel de Control</h1>
      <p>Bienvenido al sistema de gestión de pacientes</p>
    </div>

    <div class="dashboard-actions">
      <a href="{{ url_for('agregar_paciente') }}" class="action-card">
        <div class="action-icon primary">
          <i class="fas fa-user-plus"></i>
        </div>
        <h3>Agregar Paciente</h3>
        <p>Registrar nuevo paciente en el sistema</p>
      </a>

      <a href="{{ url_for('ver_pacientes') }}" class="action-card">
        <div class="action-icon secondary">
          <i class="fas fa-users"></i>
        </div>
        <h3>Ver Pacientes</h3>
        <p>Listado completo de pacientes</p>
      </a>

      <a href="{{ url_for('lista_eliminar_pacientes') }}" class="action-card">
        <div class="action-icon warning">
          <i class="fas fa-user-minus"></i>
        </div>
        <h3>Gestionar Pacientes</h3>
        <p>Editar o eliminar registros</p>
      </a>
    </div>

    <div class="dashboard-footer">
      <a href="{{ url_for('logout') }}" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
      </a>
    </div>
  </div>
</body>
</html>
